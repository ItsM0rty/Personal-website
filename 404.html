      (function () {
        var root = document.documentElement;
        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduced) return;
        root.classList.add("js-anim");
        try {
          if (sessionStorage.getItem("pixel-transition") === "arriving") {
            root.classList.add("is-pixel-covered");
            window.setTimeout(function () { root.classList.remove("is-pixel-covered"); }, 2500);
          } else if (sessionStorage.getItem("page-transition") === "quick") {
            root.classList.add("is-quick-arrival");
          }
        } catch (error) {}
        window.setTimeout(function () { root.classList.remove("js-anim", "is-quick-arrival"); }, 3000);
      })();
    </script>
